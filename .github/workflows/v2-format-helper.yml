name: V2 format helper

on:
  push:
    branches:
      - feature/v2-battle-experience
    paths:
      - .github/v2-format-trigger

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/game/SampleSoundscape.ts tests/unit/battleScene.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/SampleSoundscape.ts tests/unit/battleScene.test.ts
          if git diff --cached --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git commit -m "style: format V2 audio and scene tests"
          git push
